name: Continuous Integration

on:
    push:
        branches:
            - main
            - develop
            - "feature/**"

    pull_request:
        branches:
            - main
            - develop

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Node ${{ matrix.node }}

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node:
                    - 22
                    - 24

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: TypeScript Build
              run: npm run build

            - name: ESLint
              run: npm run lint

            - name: Prettier
              run: npm run format:check
